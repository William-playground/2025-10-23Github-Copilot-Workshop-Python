<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ポモドーロタイマー</title>
    <style>
        body { font-family: sans-serif; background: #f7f7fa; text-align: center; }
        .container { margin: 40px auto; padding: 32px; background: #fff; border-radius: 20px; box-shadow: 0 4px 24px #8882; width: 350px; }
        h1 { font-size: 1.4em; margin-bottom: 24px; }
        .circle { width: 180px; height: 180px; margin: 0 auto 24px; background: #e5e7f7; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5em; color: #555; }
        .btns { margin-bottom: 24px; }
        button { font-size: 1em; padding: 10px 32px; border-radius: 24px; border: none; margin: 0 8px; background: #7b83e6; color: #fff; cursor: pointer; }
        button.reset { background: #fff; color: #7b83e6; border: 2px solid #7b83e6; }
        .progress { background: #f2f3fa; border-radius: 12px; padding: 16px; margin-top: 24px; }
        .progress-title { font-size: 1em; color: #888; margin-bottom: 8px; }
        .progress-values { display: flex; justify-content: space-around; font-size: 1.2em; }
        .progress-values span { color: #7b83e6; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ポモドーロタイマー</h1>
        <div class="circle">25:00</div>
        <div class="btns">
            <button>開始</button>
            <button class="reset">リセット</button>
        </div>
        <div class="progress">
            <div class="progress-title">今日の進捗</div>
            <div class="progress-values">
                <div><span>0</span><br>完了</div>
                <div><span>0分</span><br>集中時間</div>
            </div>
        </div>
    </div>
</body>
</html>
